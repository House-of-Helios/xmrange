[package]
name = "xmrange-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xmrange"
path = "src/main.rs"

[features]
dev-diagnostics = ["xmrange-core/dev-diagnostics"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde_json = "1"
xmrange-core = { path = "../xmrange-core" }
