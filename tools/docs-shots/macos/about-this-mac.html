<!doctype html><meta charset="utf-8"><title>About This Mac</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:880px;height:420px;background:linear-gradient(135deg,#eef0f4,#dfe3ea);font:13px -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;color:#1d1d1f;display:flex;gap:36px;justify-content:center;align-items:center}
.win{width:390px;height:370px;background:#f6f6f6;border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.22);padding:14px 16px 26px}
.tl{display:flex;gap:8px}.tl i{width:12px;height:12px;border-radius:50%;display:block}
.tl i:nth-child(1){background:#ff5f57}.tl i:nth-child(2){background:#ffbd2e}.tl i:nth-child(3){background:#28c840}
.logo{width:96px;height:96px;margin:14px auto 12px;border-radius:22px;background:linear-gradient(#c9ced6,#9aa1ad)}
h1{font-size:22px;font-weight:700;text-align:center}
.sub{color:#86868b;text-align:center;font-size:12px;margin:2px 0 16px}
.row{display:grid;grid-template-columns:100px 1fr;padding:4px 8px;margin:0 6px;border-radius:7px;line-height:1.35;white-space:nowrap}
.row b{font-weight:600;text-align:right;padding-right:12px;color:#1d1d1f}
.row span{color:#4a4a4f}
.hl{outline:2.5px solid #f26a0d;outline-offset:1px;background:rgba(242,106,13,.08)}
.btn{display:block;margin:16px auto 0;width:110px;text-align:center;padding:4px 0;border-radius:6px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
</style>
<body>
<div class="win"><div class="tl"><i></i><i></i><i></i></div><div class="logo"></div>
<h1>MacBook Pro</h1><div class="sub">13-inch, 2022</div>
<div class="row hl"><b>Chip</b><span>Apple M2</span></div>
<div class="row"><b>Memory</b><span>16 GB</span></div>
<div class="row"><b>Serial number</b><span>XXXXXXXXXX</span></div>
<div class="row"><b>macOS</b><span>Sequoia 15.1</span></div>
<span class="btn">More Info...</span></div>
<div class="win"><div class="tl"><i></i><i></i><i></i></div><div class="logo"></div>
<h1>Mac mini</h1><div class="sub">2018</div>
<div class="row hl"><b>Processor</b><span>3.2 GHz 6-Core Intel Core i7</span></div>
<div class="row"><b>Memory</b><span>16 GB 2667 MHz DDR4</span></div>
<div class="row"><b>Serial number</b><span>XXXXXXXXXX</span></div>
<div class="row"><b>macOS</b><span>Sonoma 14.7</span></div>
<span class="btn">More Info...</span></div>
</body>
